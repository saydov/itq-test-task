databaseChangeLog:
  - changeSet:
      id: 001-create-documents
      author: system
      changes:
        - createTable:
            tableName: documents
            columns:
              - column:
                  name: id
                  type: bigserial
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: number
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: author
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: title
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(50)
                  defaultValue: DRAFT
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: bigint
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
                  constraints:
                    nullable: false

  - changeSet:
      id: 001-create-status-history
      author: system
      changes:
        - createTable:
            tableName: status_history
            columns:
              - column:
                  name: id
                  type: bigserial
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: document_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_status_history_document
                    references: documents(id)
              - column:
                  name: initiator
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: action
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: comment
                  type: text
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false

  - changeSet:
      id: 001-create-approval-registry
      author: system
      changes:
        - createTable:
            tableName: approval_registry
            columns:
              - column:
                  name: id
                  type: bigserial
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: document_id
                  type: bigint
                  constraints:
                    nullable: false
                    unique: true
                    foreignKeyName: fk_approval_registry_document
                    references: documents(id)
              - column:
                  name: approved_by
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: approved_at
                  type: timestamp
                  constraints:
                    nullable: false

  - changeSet:
      id: 001-create-indexes
      author: system
      changes:
        - createIndex:
            indexName: idx_documents_status
            tableName: documents
            columns:
              - column:
                  name: status
        - createIndex:
            indexName: idx_documents_author
            tableName: documents
            columns:
              - column:
                  name: author
        - createIndex:
            indexName: idx_documents_created_at
            tableName: documents
            columns:
              - column:
                  name: created_at
        - createIndex:
            indexName: idx_status_history_document_id
            tableName: status_history
            columns:
              - column:
                  name: document_id
